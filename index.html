<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f4"><title>MIYAKOJIMA | 나의 여행 가이드</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#17352f;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(135deg,#174d4b,#3a8a81);color:white;padding:42px max(20px,calc((100vw - 1100px)/2)) 38px}h1{font-size:clamp(30px,6vw,54px);letter-spacing:2px;margin:8px 0}header p{opacity:.9}main{max-width:1100px;margin:auto;padding:24px 16px 60px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button,.btn{border:1px solid #cbdad5;background:white;color:#205148;border-radius:100px;padding:11px 17px;cursor:pointer;font-weight:700}.tabs button.active,.btn.primary{background:#175d55;color:white;border-color:#175d55}input,textarea,select{font:inherit;padding:12px;border:1px solid #cbdad5;border-radius:10px;width:100%;background:white}#search{flex:1;min-width:190px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}.place{border-radius:18px;overflow:hidden;background:white;box-shadow:0 5px 24px #17352f12}.place img{width:100%;height:220px;object-fit:cover}.details{padding:18px}.tag{font-size:12px;background:#e3f1ed;color:#20645a;padding:5px 10px;border-radius:20px;display:inline-block}.place h2{font-size:21px;margin:12px 0 6px}.muted{color:#5d7770;font-size:14px;line-height:1.55}.actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}.actions a{display:inline-block;text-decoration:none}.adminbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px;flex-wrap:wrap}.panel{background:white;border-radius:16px;padding:22px;margin:0 0 20px;box-shadow:0 5px 24px #17352f10}.panel label{display:block;margin:12px 0 5px;font-weight:700;font-size:14px}.hidden{display:none!important}.notice{background:#fff9e6;padding:14px;border-radius:12px;margin-bottom:16px;color:#67541e}button:disabled{opacity:.5;cursor:wait}.preview{width:140px;max-height:100px;object-fit:cover;margin-top:8px}footer{text-align:center;color:#78918a;padding:24px}#status{margin-bottom:12px;color:#446b62}@media(max-width:500px){header{padding:32px 20px}.place img{height:240px}}
</style></head><body><header><small>MY OKINAWA TRAVEL COLLECTION</small><h1>MIYAKOJIMA</h1><p>식당 · 카페 · 숙소 · 스팟을 모아두는 나만의 여행 가이드</p></header><main><div class="adminbar"><button id="loginToggle" class="btn">관리자 로그인</button><button id="logout" class="btn hidden">로그아웃</button><button id="addToggle" class="btn primary hidden">+ 장소 추가</button></div><section id="loginPanel" class="panel hidden"><h2>관리자 로그인</h2><p class="muted">관리자만 로그인할 수 있습니다. 친구들은 로그인 없이 장소를 볼 수 있어요.</p><label>이메일</label><input id="email" type="email" autocomplete="username"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password"><p><button id="login" class="btn primary">로그인</button></p></section><section id="editor" class="panel hidden"><h2 id="formTitle">장소 추가</h2><form id="placeForm"><label>카테고리</label><select name="category" required><option>식당</option><option>카페</option><option>숙소</option><option>스팟</option></select><label>상호명 / 장소명</label><input name="name" required maxlength="120"><label>메뉴 / 특징</label><input name="description" maxlength="200"><label>주소</label><input name="address" required><label>구글지도 URL (선택, 비우면 주소로 검색)</label><input name="map_url" type="url"><label>메모 (선택)</label><textarea name="notes" rows="3"></textarea><label>사진 (선택)</label><input name="photo" type="file" accept="image/*"><img id="photoPreview" class="preview hidden" alt="사진 미리보기"><p class="muted">사진을 선택하지 않으면 기존 사진이 유지됩니다.</p><button id="save" class="btn primary" type="submit">저장하기</button> <button id="cancel" class="btn" type="button">취소</button></form></section><div id="setupNotice" class="notice hidden">미리보기 모드입니다. 관리자 로그인과 자동 저장을 사용하려면 config.js에 Supabase 연결 정보를 입력하고 SQL 설정을 완료하세요.</div><div class="toolbar"><div id="tabs" class="tabs"></div><input id="search" placeholder="장소명 · 메뉴 · 주소 검색" aria-label="장소 검색"></div><p id="status"></p><div id="cards" class="grid"></div></main><footer>Made for Miyakojima memories 🌴</footer><script src="config.js"></script><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const seed=[{id:'sample1',category:'식당',name:'Spice & Fresh',description:'일본식 카레',address:'Shimozato-398-2 Hirara, Miyakojima, Okinawa 906-0013, Japan',image_url:'images/spice-fresh.png',notes:''},{id:'sample2',category:'식당',name:'Hi to Tsuki',description:'이자카야 · 모둠 사시미',address:'Shimozato-401-5 Hirara, Miyakojima, Okinawa 906-0013, Japan',image_url:'images/hi-to-tsuki.png',notes:''},{id:'sample3',category:'식당',name:'카메 스시 (亀寿司)',description:'스시 · 모둠 초밥',address:'Kugai-852-11 Hirara, Miyakojima, Okinawa 906-0015, Japan',image_url:'images/kame-sushi.png',notes:''}];
const $=id=>document.getElementById(id), cfg=window.SITE_CONFIG||{}, ready=!!(cfg.supabaseUrl&&cfg.supabaseAnonKey), sb=ready?createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null;let places=seed,admin=false,editId=null,cat='전체';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mapLink=p=>p.map_url&&/^https:\/\/(www\.)?(google\.[^/]+|maps\.app\.goo\.gl)\//i.test(p.map_url)?p.map_url:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.name+' '+p.address);
function render(){const cats=['전체','식당','카페','숙소','스팟'];$('tabs').innerHTML=cats.map(c=>`<button class="${cat===c?'active':''}" data-cat="${c}">${c} ${c==='전체'?places.length:places.filter(p=>p.category===c).length}</button>`).join('');const q=$('search').value.trim().toLowerCase();let filtered=places.filter(p=>(cat==='전체'||p.category===cat)&&[p.name,p.description,p.address,p.notes].some(s=>String(s||'').toLowerCase().includes(q)));$('status').textContent=`${filtered.length}개 장소`; $('cards').innerHTML=filtered.map(p=>`<article class="place">${p.image_url?`<img loading="lazy" src="${esc(p.image_url)}" alt="${esc(p.name)} 사진">`:''}<div class="details"><span class="tag">${esc(p.category)}</span><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><p class="muted">📍 ${esc(p.address)}</p>${p.notes?`<p class="muted">${esc(p.notes)}</p>`:''}<div class="actions"><a class="btn primary" target="_blank" rel="noopener noreferrer" href="${esc(mapLink(p))}">구글지도 보기 ↗</a>${admin?`<button class="btn" data-edit="${esc(p.id)}">수정</button><button class="btn" data-delete="${esc(p.id)}">삭제</button>`:''}</div></div></article>`).join('')||'<p>등록된 장소가 없어요.</p>'}
$('tabs').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){cat=b.dataset.cat;render()}};$('search').oninput=render;
function ui(){ $('loginToggle').classList.toggle('hidden',admin||!ready);$('logout').classList.toggle('hidden',!admin);$('addToggle').classList.toggle('hidden',!admin);if(!admin){$('editor').classList.add('hidden');$('loginPanel').classList.add('hidden')}render()}
function resetForm(){$('placeForm').reset();editId=null;$('formTitle').textContent='장소 추가';$('photoPreview').classList.add('hidden')}
$('loginToggle').onclick=()=>$('loginPanel').classList.toggle('hidden');$('addToggle').onclick=()=>{resetForm();$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth'})};$('cancel').onclick=()=>{$('editor').classList.add('hidden');resetForm()};$('placeForm').photo.onchange=()=>{const f=$('placeForm').photo.files[0];if(f){$('photoPreview').src=URL.createObjectURL(f);$('photoPreview').classList.remove('hidden')}};
async function refresh(){if(!sb)return;const {data,error}=await sb.from('places').select('*').order('created_at',{ascending:true});if(error){$('status').textContent='불러오기 실패: '+error.message;return}places=data||[];render()}
async function auth(){if(!sb)return;const {data}=await sb.auth.getSession();admin=!!data.session;ui();await refresh()}
$('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){alert('로그인 실패: '+error.message);return}$('password').value='';await auth()};$('logout').onclick=async()=>{await sb.auth.signOut();admin=false;ui()};
$('cards').onclick=async e=>{const eb=e.target.closest('[data-edit]'),db=e.target.closest('[data-delete]');if(eb&&admin){const p=places.find(p=>String(p.id)===eb.dataset.edit);if(!p)return;resetForm();editId=p.id;for(const k of ['category','name','description','address','map_url','notes'])$('placeForm').elements[k].value=p[k]||'';$('formTitle').textContent='장소 수정';if(p.image_url){$('photoPreview').src=p.image_url;$('photoPreview').classList.remove('hidden')}$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth'})}if(db&&admin&&confirm('이 장소를 삭제할까요?')){const {error}=await sb.from('places').delete().eq('id',db.dataset.delete);if(error)alert(error.message);else await refresh()}};
$('placeForm').onsubmit=async e=>{e.preventDefault();if(!sb||!admin)return;const btn=$('save');btn.disabled=true;try{const f=$('placeForm'),row={};for(const k of ['category','name','description','address','map_url','notes'])row[k]=f.elements[k].value.trim();const file=f.photo.files[0];if(file){if(!file.type.startsWith('image/'))throw Error('이미지 파일만 업로드할 수 있어요.');if(file.size>6*1024*1024)throw Error('사진은 6MB 이하로 올려주세요.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('place-images').upload(path,file,{contentType:file.type});if(error)throw error;row.image_url=sb.storage.from('place-images').getPublicUrl(path).data.publicUrl}const result=editId?await sb.from('places').update(row).eq('id',editId):await sb.from('places').insert(row);if(result.error)throw result.error;resetForm();$('editor').classList.add('hidden');await refresh();alert('저장됐어요. 친구들이 새로고침하면 최신 내용이 보여요.')}catch(err){alert('저장 실패: '+err.message)}finally{btn.disabled=false}};
if(!ready){$('setupNotice').classList.remove('hidden');render()}else{sb.auth.onAuthStateChange((_event,session)=>{admin=!!session;ui()});auth()}
</script></body></html>
